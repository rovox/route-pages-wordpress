<div class="trufi-route">
    <div class="trufi-hero">
        <div class="trufi-hero-copy">
            <a class="trufi-route-back" href="{{indexUrl}}"><span class="trufi-icon" data-icon="arrowLeft" aria-hidden="true"></span> Ver todas las rutas</a>
            <h1 id="routeName">{{routeHeadline}}</h1>
            <p>{{routeSubtitle}}</p>
        </div>
        <div class="trufi-hero-stats">
            <div class="trufi-hero-stat">
                <strong>{{routeDistance}}</strong>
                <span>Distancia</span>
            </div>
            <div class="trufi-hero-stat">
                <strong>{{routeStopCount}}</strong>
                <span>Paradas</span>
            </div>
        </div>
    </div>

    <div class="trufi-route-toolbar">
        <div class="trufi-store-buttons">
            <a href="{{googlePlayUrl}}" id="google-play-btn">
                <img src="{{googlePlayImage}}" alt="Descargar en Google Play">
            </a>
            <a href="{{appleStoreUrl}}" id="apple-store-btn">
                <img src="{{appleStoreImage}}" alt="Descargar en la App Store">
            </a>
        </div>
    </div>

    <div class="trufi-route-body">
        <div class="trufi-route-sidebar">
            <div class="trufi-list-title">
                <span class="trufi-list-title-label"><span class="trufi-icon" data-icon="route" aria-hidden="true"></span> Paradas</span>
                <button type="button" class="trufi-icon-btn" id="trufi-route-share" title="Compartir esta ruta"><span class="trufi-icon" data-icon="share" aria-hidden="true"></span></button>
            </div>
            <ul class="trufi-stops-list" id="trufi-route-stops">{{stopsListHtml}}</ul>
        </div>
        <div class="trufi-route-map-wrap">
            <div class="trufi-map-hint" id="trufi-route-map-hint"></div>
            <div id="trufi-route-map" class="trufi-map"></div>
            <button type="button" class="trufi-geo-btn" id="trufi-geo-btn" title="Marcar dónde estoy" data-show-location="{{showLocation}}"><span class="trufi-icon" data-icon="locate" aria-hidden="true"></span> Mi ubicación</button>
        </div>
    </div>
</div>
